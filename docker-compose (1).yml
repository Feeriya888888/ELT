services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ch-elt
    environment:
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst_pass
      CLICKHOUSE_DB: raw
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
